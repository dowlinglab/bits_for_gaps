# Publish to PyPI (on a `v*` tag push) or TestPyPI (manual dry run) via OIDC trusted
# publishing -- no API tokens stored anywhere in this repo. See RELEASE.md for the
# one-time trusted-publisher registration this depends on (maintainer-only, PyPI and
# TestPyPI each need their own, both naming this workflow file and the `release`
# environment below) and the full release checklist.
#
# `pypa/gh-action-pypi-publish` is referenced by PyPA's own recommended floating tag
# (`release/v1`, which PyPA moves to point at the latest v1.x release) rather than a
# commit SHA -- this session had no network access to look up and verify a real SHA,
# and a fabricated one would be worse than an honest floating-tag reference. Before
# the first real publish, the maintainer should pin this to a specific released
# version's commit SHA (see https://github.com/pypa/gh-action-pypi-publish/releases)
# for a fully immutable reference, e.g. `@<sha> # v1.x.y`.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}  # manual dry run -> always publishes to TestPyPI, never PyPI

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install build backend + twine
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check (clean long-description render, well-formed metadata)
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Manual dry run (workflow_dispatch) -- TestPyPI only, never triggered by a tag push.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://test.pypi.org/p/bits_for_gaps
    permissions:
      id-token: write  # required for OIDC trusted publishing; no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # Real release -- only a `v*` tag push reaches this job.
  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/bits_for_gaps
    permissions:
      id-token: write  # required for OIDC trusted publishing; no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
