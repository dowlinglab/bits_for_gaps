# Publish to PyPI (on a `v*` tag push) or TestPyPI (manual dry run) via OIDC trusted
# publishing -- no API tokens stored anywhere in this repo. See RELEASE.md for the
# one-time trusted-publisher registration this depends on (maintainer-only, PyPI and
# TestPyPI each need their own, both naming this workflow file and the `release`
# environment below) and the full release checklist.
#
# `pypa/gh-action-pypi-publish` is pinned to an immutable commit SHA (supply-chain
# hardening: a floating tag like `release/v1` can be moved). The pinned SHA
# dc37677b2e1c63e2034f94d8a5b11f265b73ba33 is release v1.14.2, verified via the GitHub
# API to be the same commit `release/v1` pointed at for the successful 2026-08-06
# TestPyPI dry run -- so this pin is the known-good version, not an untested bump.
# To update: look up the desired release's commit SHA at
# https://github.com/pypa/gh-action-pypi-publish/releases and change both `uses:` lines.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}  # manual dry run -> always publishes to TestPyPI, never PyPI

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install build backend + twine
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check (clean long-description render, well-formed metadata)
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Manual dry run (workflow_dispatch) -- TestPyPI only, never triggered by a tag push.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://test.pypi.org/p/bits_for_gaps
    permissions:
      id-token: write  # required for OIDC trusted publishing; no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # Real release -- only a `v*` tag push reaches this job.
  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/bits_for_gaps
    permissions:
      id-token: write  # required for OIDC trusted publishing; no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
