# CI — lint + the full default test suite (unit + integration + regression) on the
# pure-Python core (no Julia/[vle] extra installed), across every Python version this
# package claims to support (3.9-3.12; see pyproject.toml's requires-python and
# docs/installation.md for why 3.13+ isn't -- upstream, GPflow requires numpy<2 and no
# numpy 1.x supports 3.13). `pytest -q`'s own addopts (`-m 'not vle'`) deselects the
# Julia-backed tests automatically -- confirmed none of the non-`vle`-marked tests
# import anything Julia-touching at module import time, so this runs clean without the
# [vle] extra. Julia-backed VLE + regression tests that need it stay a separate, gated
# job for whenever CI grows a Julia-capable runner.
#
# Coverage is measured on the 3.12 matrix leg only (one upload, not four -- Codecov
# would otherwise report the same numbers repeatedly) and uploaded to Codecov. Codecov
# requires a repository token even for public repos, supplied via the CODECOV_TOKEN
# repository secret; without it the upload is rejected ("Token required - not valid
# tokenless upload") and the README badge reads "unknown". `pytest-cov`'s own
# `fail_under` (pyproject.toml's [tool.coverage.report]) is what actually gates
# coverage regressions -- Codecov's upload is reporting/visibility on top of that, not
# a second gate, so a transient upload failure (e.g. codecov.io being briefly
# unreachable) doesn't fail CI (`fail_ci_if_error: false`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the default test suite (unit + integration + regression, not vle)
        if: matrix.python-version != '3.12'
        run: pytest -q
      - name: Run the default test suite with coverage (3.12 only, for Codecov)
        if: matrix.python-version == '3.12'
        run: pytest -q --cov=bits_for_gaps --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
