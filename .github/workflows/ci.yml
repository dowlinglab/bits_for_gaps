# CI skeleton — runs the pure-Python unit tests on the core package.
# NOTE (Phase 3/8): this is a starting point. The frozen stack (TF 2.16.2 / GPflow 2.9.2
# / Py 3.9) can be finicky on Linux runners; the Julia-backed VLE + regression tests
# should live in a separate, gated job. Refine when wiring ReadTheDocs + release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q tests/unit
