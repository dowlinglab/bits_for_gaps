[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bits_for_gaps"
version = "0.0.1.dev0"
description = "Bayesian Information-Theoretic Sampling for hierarchical GAussian Process Surrogates (BITS for GAPS)"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Alexander W. Dowling", email = "adowling@nd.edu" },
    { name = "Kyla D. Jones" },
]
keywords = [
    "gaussian-process", "bayesian-optimization", "hybrid-modeling",
    "surrogate-modeling", "experimental-design", "information-theory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering",
]

# Frozen reproduction baseline (see REFACTOR_PLAN.md decision 4).
# tensorflow-macos on Apple Silicon; plain tensorflow elsewhere.
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.13,<1.14",
    "gpflow==2.9.2",
    "tensorflow-probability==0.24.0",
    "tf-keras==2.16.0",
    "tensorflow-macos==2.16.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "tensorflow==2.16.2; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "tqdm",
]

[project.optional-dependencies]
# VLE/distillation example backend (Julia + Clapeyron via juliacall).
vle = ["juliacall==0.9.23", "juliapkg==0.1.13"]
dev = ["pytest>=7", "pytest-cov", "ruff"]
docs = ["sphinx>=7", "myst-parser", "furo", "sphinx-autodoc-typehints"]

[project.urls]
Homepage = "https://github.com/dowlinglab/bits_for_gaps"
Paper = "https://doi.org/10.1016/j.compchemeng.2026.109650"

[tool.hatch.build.targets.wheel]
packages = ["src/bits_for_gaps"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# B023: loop-variable-in-closure -- several acquisition/mixture functions deliberately
# close over a loop variable in a callback that's called within the same iteration
# (not stored for later), matching the paper code's structure; not a real bug here.
ignore = ["B023"]

[tool.ruff.lint.per-file-ignores]
# Load-bearing import order -- do NOT let isort (I001) reorder these:
# - __init__.py's eager (pure NumPy/SciPy) vs lazy (TF/GPflow-backed, PEP 562
#   __getattr__) split is the whole point of the module; keep the import groups as
#   written even though ruff wouldn't currently reorder across the blank-line-
#   separated comments below.
"src/bits_for_gaps/__init__.py" = ["I001"]
# - activity_model.py sets PYTHON_JULIACALL_HANDLE_SIGNALS before the local
#   `from juliacall import Main as jl` import inside _require_activity_fn -- required
#   on macOS or juliacall SIGBUSes. This is a function-local import ruff's isort
#   wouldn't touch, but ignore E402 here defensively in case rule selection changes.
"examples/vle_distillation/activity_model.py" = ["I001", "E402"]
# - full_reproduction.py sets TF's single-threaded config (a >10x wall-clock fix
#   found during Phase 9b's investigation) before importing bits_for_gaps/
#   vle_distillation, so those imports don't trigger TF's default multi-threaded
#   init first.
"paper/full_reproduction.py" = ["I001", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `vle` tests need the Julia/Clapeyron backend; deselect them by default so a plain
# `pytest -q` is green on the pure-Python core. Run them with `pytest -m vle`.
addopts = "-ra -m 'not vle'"
markers = [
    "vle: requires the Julia/Clapeyron VLE example backend (deselected by default)",
    "slow: slower end-to-end tests (still run by default)",
]
