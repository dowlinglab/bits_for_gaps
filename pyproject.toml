[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bits_for_gaps"
dynamic = ["version"]
description = "Bayesian Information-Theoretic Sampling for hierarchical GAussian Process Surrogates (BITS for GAPS)"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Alexander W. Dowling", email = "adowling@nd.edu" },
    { name = "Kyla D. Jones" },
]
keywords = [
    "gaussian-process", "bayesian-optimization", "hybrid-modeling",
    "surrogate-modeling", "experimental-design", "information-theory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

# Frozen reproduction baseline: an exact, verified-working stack rather than floating
# version ranges, since GPflow's TensorFlow dependency makes casual version bumps
# risky. tensorflow-macos on Apple Silicon; plain tensorflow elsewhere. Verified on
# Python 3.9-3.12 (see docs/installation.md); the numpy<2 pin is also why 3.13+ isn't
# available -- GPflow requires numpy<2 in every release, and no numpy 1.x supports
# Python 3.13 (an upstream constraint -- see docs/installation.md).
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.13,<1.14",
    "gpflow==2.9.2",
    "tensorflow-probability==0.24.0",
    "tf-keras==2.16.0",
    "tensorflow-macos==2.16.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "tensorflow==2.16.2; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "tqdm",
    # setuptools is already a runtime dependency of gpflow (>=41.0.0); we add the UPPER
    # bound because gpflow 2.9.2 does `import pkg_resources` at import time
    # (gpflow/versions.py) and setuptools >= 81 REMOVED pkg_resources. Without this,
    # `pip install bits_for_gaps` into an environment with current setuptools yields a
    # package whose TF-backed modules (kernels/means/gp/mixture/acquisition/sampler) all
    # fail with `ModuleNotFoundError: No module named 'pkg_resources'` -- setuptools'
    # own deprecation warning recommends exactly this pin. Revisit when the frozen
    # GPflow/TF stack is modernized.
    "setuptools<81",
]

[project.optional-dependencies]
# VLE/distillation example backend (Julia + Clapeyron via juliacall).
vle = ["juliacall==0.9.23", "juliapkg==0.1.13"]
dev = ["pytest>=7", "pytest-cov", "ruff"]
docs = ["sphinx>=7", "myst-parser", "furo", "sphinx-autodoc-typehints"]

[project.urls]
Homepage = "https://github.com/dowlinglab/bits_for_gaps"
Repository = "https://github.com/dowlinglab/bits_for_gaps"
Documentation = "https://bits-for-gaps.readthedocs.io"
Changelog = "https://github.com/dowlinglab/bits_for_gaps/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1016/j.compchemeng.2026.109650"

[tool.hatch.version]
# Single-sources the version from __version__ (hatchling's default "regex" version
# source matches `__version__ = "..."`) -- see src/bits_for_gaps/__init__.py, which
# stays the one place that gets edited to cut a release.
path = "src/bits_for_gaps/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bits_for_gaps"]

[tool.hatch.build.targets.sdist]
# hatchling's default sdist includes the whole repo (paper/data's ~16 MB, tests/,
# examples/, docs/) -- restrict it to the package + the files a source release needs
# (examples/paper/docs stay repo-only, not shipped -- see docs/installation.md).
# `only-include` (not `include`, which ADDS to hatchling's default vcs-based file set
# rather than replacing it) is what actually makes this an allowlist.
only-include = [
    "src/bits_for_gaps",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# B023: loop-variable-in-closure -- several acquisition/mixture functions deliberately
# close over a loop variable in a callback that's called within the same iteration
# (not stored for later), matching the paper code's structure; not a real bug here.
ignore = ["B023"]

[tool.ruff.lint.per-file-ignores]
# Load-bearing import order -- do NOT let isort (I001) reorder these:
# - __init__.py's eager (pure NumPy/SciPy) vs lazy (TF/GPflow-backed, PEP 562
#   __getattr__) split is the whole point of the module; keep the import groups as
#   written even though ruff wouldn't currently reorder across the blank-line-
#   separated comments below.
"src/bits_for_gaps/__init__.py" = ["I001"]
# - activity_model.py sets PYTHON_JULIACALL_HANDLE_SIGNALS before the local
#   `from juliacall import Main as jl` import inside _require_activity_fn -- required
#   on macOS or juliacall SIGBUSes. This is a function-local import ruff's isort
#   wouldn't touch, but ignore E402 here defensively in case rule selection changes.
"examples/vle_distillation/activity_model.py" = ["I001", "E402"]
# - full_reproduction.py sets TF's single-threaded config (a >10x wall-clock fix for
#   this script's many small ops) before importing bits_for_gaps/vle_distillation, so
#   those imports don't trigger TF's default multi-threaded init first.
"paper/full_reproduction.py" = ["I001", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `vle` tests need the Julia/Clapeyron backend; deselect them by default so a plain
# `pytest -q` is green on the pure-Python core. Run them with `pytest -m vle`.
# Deliberately NOT `--cov=...` here: a plain `pytest -q` (what a contributor runs day
# to day) stays fast and its output stays unchanged. Measure coverage explicitly with
# `pytest --cov=bits_for_gaps --cov-report=term-missing` (see README.md/docs); CI wires
# that invocation in on one job so `fail_under` below actually gates something.
addopts = "-ra -m 'not vle'"
markers = [
    "vle: requires the Julia/Clapeyron VLE example backend (deselected by default)",
    "slow: slower end-to-end tests (still run by default)",
]

[tool.coverage.run]
# Measure only the shipped package -- examples/, paper/, and tests/ are repo-only
# (see docs/installation.md) and would otherwise dilute the denominator with code
# that was never meant to ship.
source = ["bits_for_gaps"]
branch = true

[tool.coverage.report]
# `pytest -m vle`'s 2 Julia-backed tests are deselected by default (see above), so
# default-suite coverage never reflects them -- that's expected, not a gap to chase.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
]
# 100% measured on the default suite (`pytest -q --cov=bits_for_gaps --cov-branch`,
# 605 statements + 134 branches) as of the commit that added this config -- 1 point of
# slack for legitimate small variation (coverage.py branch-counting differences across
# supported Python versions), not to paper over a regression.
fail_under = 99
